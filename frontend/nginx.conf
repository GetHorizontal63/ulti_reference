server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Real client IP: cloudflared (Docker bridge) sends CF-Connecting-IP.
    # Only trusted when the peer is on the Docker network, so LAN clients
    # hitting :3000 directly can't spoof it.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header   CF-Connecting-IP;

    # Static JSON bundles are large (tens of MB per season) — compress them.
    gzip            on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types      application/json application/javascript text/css image/svg+xml;

    # Proxy API requests to the backend container
    location /api/ {
        proxy_pass         http://backend:8000/api/;
        proxy_set_header   Host              $host;
        # Overwrite (never append to) client-supplied forwarding headers
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_read_timeout 120s;
    }

    # Static JSON bundles, generated by the worker into the exports volume
    # (mounted at html/data). Missing files must 404, not fall back to the SPA.
    location /data/ {
        try_files $uri =404;
        expires 1h;
    }

    # SPA fallback — all other routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets never change — cache aggressively
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Images/models are not content-hashed — cache, but allow revalidation
    location ~* \.(png|jpg|jpeg|svg|ico|woff2?|glb|stl)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
