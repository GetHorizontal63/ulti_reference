name: Build & publish images

# Every push to main: test, then build the api / worker / web images and push
# them to GitHub Container Registry as :latest and :<commit-sha>.
# TrueNAS pulls these — see DEPLOY.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docker/requirements-api.txt
      - run: pip install -r docker/requirements-api.txt pytest
      - run: python -m compileall -q backend pipelines sync_all.py
      - run: pytest -q tests/

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend build
        working-directory: frontend
        run: npm ci && npm run build
        env:
          VITE_BASE: /

  images:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            context: .
            dockerfile: docker/api.Dockerfile
          - name: worker
            context: .
            dockerfile: docker/worker.Dockerfile
          - name: web
            context: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            VITE_BASE=/
            VITE_ENABLE_USAU=${{ vars.ENABLE_USAU || 'false' }}
          tags: |
            ghcr.io/gethorizontal63/ulti_reference-${{ matrix.name }}:latest
            ghcr.io/gethorizontal63/ulti_reference-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
