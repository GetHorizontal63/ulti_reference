name: Deploy Pages (optional mirror)

# Manual only: production is TrueNAS. Run from Actions → "Deploy Pages" once
# Pages is enabled (Settings → Pages → Source: GitHub Actions). See DEPLOY.md.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          # Pages is static-only: point /api/ calls at the TrueNAS backend.
          # Set under Settings → Secrets and variables → Actions → Variables,
          # e.g. https://yourdomain.com, and add this Pages origin
          # (https://<user>.github.io) to the backend's CORS_ORIGINS.
          VITE_API_BASE: ${{ vars.API_BASE_URL }}
          VITE_ENABLE_USAU: ${{ vars.ENABLE_USAU || 'false' }}
      # SPA deep links: Pages serves 404.html for unknown paths, so make it the app shell
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
